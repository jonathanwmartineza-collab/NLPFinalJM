<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Preview</title>
<style>html,body{margin:0;height:100%;font:14px system-ui,sans-serif;color:#5f5750;display:grid;place-items:center}</style></head>
<body><p>Waiting for a build…</p>
<script>
// Runs with an opaque origin (CSP sandbox + iframe sandbox, no allow-same-origin):
// it can't read the studio's cookies or storage, and connect-src 'none' blocks network requests.
(function () {
  var done = false;
  window.addEventListener('message', function (e) {
    if (done || e.source !== window.parent || !e.data || e.data.type !== 'render' || typeof e.data.html !== 'string') return;
    done = true;
    document.open(); document.write(e.data.html); document.close();
  });
  window.parent.postMessage({ type: 'ready' }, '*');
})();
</script></body></html>
